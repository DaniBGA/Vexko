# nginx.conf — Kiosco App
#
# Sirve el frontend compilado (app/frontend/dist) como archivos estáticos y
# hace de proxy reverso hacia el backend Node/PM2 en /api. Después de correr
# certbot --nginx (ver GUIA_DEPLOY.md) este archivo se edita automáticamente
# para agregar el bloque de SSL (443) — no hace falta tocar eso a mano.
#
# Instalación: copiar a /etc/nginx/sites-available/kiosco y symlink a
# sites-enabled (ver GUIA_DEPLOY.md).

upstream kiosco_backend {
    # PM2 en modo cluster ya reparte la carga entre sus propias instancias
    # (ver ecosystem.config.cjs); nginx solo necesita el puerto único que
    # todas comparten.
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    root /var/www/kiosco-app/app/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Los assets de Vite llevan hash en el nombre (son inmutables): cache
    # largo del lado del navegador. index.html en cambio NUNCA se cachea,
    # para que el próximo deploy se vea al instante sin tener que limpiar
    # caché a mano.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API -> proxy al backend Node (PM2)
    location /api/ {
        proxy_pass http://kiosco_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta que no sea un archivo real ni /api sirve
    # index.html, para que el ruteo de React Router funcione al refrescar
    # la página en, por ejemplo, /stock o /historial.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/kiosco-access.log;
    error_log /var/log/nginx/kiosco-error.log;
}
