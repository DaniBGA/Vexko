name: Deploy a producción

# Se dispara solo con push a main — o a mano desde la pestaña "Actions" de
# GitHub (botón "Run workflow") si alguna vez hace falta re-desplegar sin
# un commit nuevo. Ver docs/GUIA_DEPLOY.md para el setup inicial de los secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar por SSH y correr deploy.sh en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd /var/www/kiosco-app
            ./deploy.sh
